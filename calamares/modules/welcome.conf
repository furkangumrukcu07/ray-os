---
# Calamares Welcome Module Configuration for Ray OS
# Universal Multi-Language Support enabled by default

showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
showDonateUrl:          false

requirements:
    requiredStorage:    12.0
    requiredRam:        2.0
    internetCheckUrl:   http://deb.debian.org
    check:
        - storage
        - ram
        - power
        - internet
    required:
        - storage
        - ram

# GeoIP for automatic language and timezone pre-selection
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
